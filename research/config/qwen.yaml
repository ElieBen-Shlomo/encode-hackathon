# Default settings for Qwen inference through Tinker.
# Command-line flags override these values, e.g. --max-tokens 32768.
base_model: Qwen/Qwen3.8-27B
model_path: null                     # tinker://... sampler checkpoint of the fine-tune; null samples the base model (or pass --model-path)
project_id: 14017256-055e-4590-a166-c4d55c6154a6
renderer: qwen3_8_low_reasoning      # dev-100: low = medium = adaptive (65/64/64), fastest; xhigh truncates at any cap
concurrency: 400
max_tokens: 32768
temperature: 0
fallback_renderers: auto              # a reply cut off by max_tokens is retried one thinking level lower (xhigh > medium > low > off); none = disabled
retries: 6                           # attempts per model call on throttling / transient errors (typed Tinker errors + status codes)
call_timeout: 900                    # seconds per attempt; bounds a hung call so one task cannot block for hours
digest: grid                         # workbook view for the agent: formulas -> values, typed headers, names (dev-100: 88% vs 75% windowed)
libreoffice_concurrency: null        # default CPU count; bounds local recalcs independently of `concurrency`
sandbox_concurrency: null            # default 2x CPU count
reads_concurrency: null              # in-process workbook reads (inspect_range, diffs); default 2x CPU count
max_turns: 20
tool_timeout: 120
review_after_edit: true
auto_recalculate_formulas: true
verify_changes: true
critic_enabled: false
critic_max_tokens: 8192
max_critic_rounds: 2
strict_critic_json: true

# Default settings for Qwen inference through Tinker.
# Command-line flags override these values, e.g. --max-tokens 32768.
base_model: Qwen/Qwen3.8-27B
project_id: 14017256-055e-4590-a166-c4d55c6154a6
renderer: qwen3_8_medium_reasoning   # start at medium: xhigh exhausts max_tokens while still thinking
concurrency: 4
max_tokens: 32768
temperature: 0
# When a reply is cut off by max_tokens, retry one thinking level lower per attempt:
# auto = step down the Qwen3.8 ladder from `renderer` (xhigh -> medium -> low -> off);
# or give an explicit list of renderer names; null disables retries.
fallback_renderers: auto
